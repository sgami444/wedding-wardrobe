<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" fill="none">
  <defs>
    <linearGradient id="paper" x1="500" y1="5" x2="500" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f8eadd"/>
      <stop offset="1" stop-color="#efdfcf"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-8%" width="110%" height="125%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#71523b" flood-opacity=".23"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".065"/></feComponentTransfer>
      <feComposite in2="SourceAlpha" operator="in" result="texture"/>
      <feBlend in="SourceGraphic" in2="texture" mode="multiply"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <path d="M5 5H995L983 78Q980 96 964 105L520 325Q500 336 480 325L36 105Q20 96 17 78Z" fill="url(#paper)" filter="url(#grain)"/>
    <path d="M5 5H995L983 78Q980 96 964 105L520 325Q500 336 480 325L36 105Q20 96 17 78Z" stroke="#fff7ec" stroke-width="2"/>
    <path d="M9 7H991" stroke="#dcc8b3" stroke-opacity=".65"/>
  </g>
</svg>
