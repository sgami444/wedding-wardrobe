name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Check guide routes and invitation behavior
        run: node --test tests/routes.test.cjs

      - name: Prepare audience routes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/wardrobe _site/attire

          cp index.html _site/index.html
          cp -R assets css js _site/

          for route in wardrobe attire wardrobe/engagement wardrobe/garba; do
            mkdir -p "_site/$route"
            cp index.html "_site/$route/index.html"
            cp -R assets css js "_site/$route/"
          done

          cp -R margee _site/margee
          cp -R sahil _site/sahil

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
