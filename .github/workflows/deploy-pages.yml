name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.pages-artifact.outputs.artifact_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Check guide routes and deployment behavior
        run: node --test tests/routes.test.cjs tests/deploy-pages.test.mjs

      - name: Prepare audience routes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/wardrobe _site/attire

          cp index.html _site/index.html
          cp -R assets css js _site/

          for route in wardrobe attire wardrobe/engagement wardrobe/garba; do
            mkdir -p "_site/$route"
            cp index.html "_site/$route/index.html"
            cp -R assets css js "_site/$route/"
          done

          cp -R margee _site/margee
          cp -R sahil _site/sahil

      - name: Upload site artifact
        id: pages-artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v7

      - name: Deploy to GitHub Pages
        id: deployment
        run: node .github/scripts/deploy-pages.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
